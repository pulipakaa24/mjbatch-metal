[project]
name = "mjbatch-metal"
version = "0.1.0"
description = "Batched MuJoCo observation rendering, native on Apple Silicon (Metal via wgpu)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.0",
    "wgpu>=0.16",
    "numpy",
]

[project.optional-dependencies]
decimate = ["fast_simplification"]
examples = ["stable-baselines3>=2.0", "gymnasium", "torch"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
